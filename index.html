<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hella Ludo - Yalla Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0c1014;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Top Header / Profile Bar */
        .top-bar {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(180deg, #1f2937, #111827);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #374151;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #f59e0b;
            background: #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .user-details h3 {
            font-size: 14px;
            color: #f3f4f6;
        }

        .user-details p {
            font-size: 11px;
            color: #9ca3af;
        }

        .currencies {
            display: flex;
            gap: 10px;
        }

        .currency-box {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #fbbf24;
            font-weight: bold;
        }

        /* Banner Arena */
        .banner {
            width: 92%;
            max-width: 420px;
            margin: 15px 0;
            background: linear-gradient(135deg, #b91c1c, #7f1d1d);
            border: 2px solid #ef4444;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .banner h2 {
            font-size: 20px;
            color: #fef08a;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px #000;
        }

        /* Game Modes */
        .mode-container {
            width: 92%;
            max-width: 420px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .mode-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .mode-card:active {
            transform: scale(0.96);
        }

        .mode-card.active {
            border: 2px solid #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }

        .mode-card h4 {
            font-size: 15px;
            color: #f8fafc;
            margin-top: 5px;
        }

        /* Ludo Board Area */
        .board-container {
            width: 92%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            background: #1e293b;
            border: 4px solid #f59e0b;
            border-radius: 12px;
            position: relative;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        /* Ludo Bases */
        .base {
            grid-row: span 6;
            grid-column: span 6;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0f172a;
        }

        .base-red { background: #dc2626; grid-area: 1 / 1 / 7 / 7; }
        .base-green { background: #16a34a; grid-area: 1 / 10 / 7 / 16; }
        .base-yellow { background: #ca8a04; grid-area: 10 / 10 / 16 / 16; }
        .base-blue { background: #2563eb; grid-area: 10 / 1 / 16 / 7; }

        .base-inner {
            width: 70%;
            height: 70%;
            background: #ffffff;
            border-radius: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            padding: 6px;
            gap: 6px;
        }

        .token-slot {
            background: #cbd5e1;
            border-radius: 50%;
            border: 1px dashed #64748b;
        }

        /* Center Winner Area */
        .center-home {
            grid-area: 7 / 7 / 10 / 10;
            background: #475569;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
        }

        /* Game Controls / Dice */
        .controls {
            width: 92%;
            max-width: 420px;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f2937;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid #374151;
        }

        .dice-btn {
            width: 55px;
            height: 55px;
            background: #f59e0b;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #b45309;
            transition: transform 0.1s;
        }

        .dice-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .status-text {
            font-size: 14px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Profile Header -->
    <div class="top-bar">
        <div class="user-info">
            <div class="avatar">H</div>
            <div class="user-details">
                <h3>Hella Player</h3>
                <p>ID: 8872103</p>
            </div>
        </div>
        <div class="currencies">
            <div class="currency-box">🪙 50,000</div>
            <div class="currency-box">💎 120</div>
        </div>
    </div>

    <!-- Battle Banner -->
    <div class="banner">
        <h2>⚔️ BATTLE ARENA ⚔️</h2>
        <p style="font-size: 12px; color: #fca5a5; margin-top: 4px;">Play & Win Big Rewards!</p>
    </div>

    <!-- Mode Selector -->
    <div class="mode-container">
        <div class="mode-card active">
            <div style="font-size: 20px;">🎲</div>
            <h4>Classic</h4>
        </div>
        <div class="mode-card">
            <div style="font-size: 20px;">⚡</div>
            <h4>Quick Mode</h4>
        </div>
    </div>

    <!-- Ludo Board -->
    <div class="board-container">
        <div class="base base-red">
            <div class="base-inner">
                <div class="token-slot" style="background: #ef4444;"></div>
                <div class="token-slot" style="background: #ef4444;"></div>
                <div class="token-slot" style="background: #ef4444;"></div>
                <div class="token-slot" style="background: #ef4444;"></div>
            </div>
        </div>
        <div class="base base-green">
            <div class="base-inner">
                <div class="token-slot" style="background: #22c55e;"></div>
                <div class="token-slot" style="background: #22c55e;"></div>
                <div class="token-slot" style="background: #22c55e;"></div>
                <div class="token-slot" style="background: #22c55e;"></div>
            </div>
        </div>
        <div class="base base-yellow">
            <div class="base-inner">
                <div class="token-slot" style="background: #eab308;"></div>
                <div class="token-slot" style="background: #eab308;"></div>
                <div class="token-slot" style="background: #eab308;"></div>
                <div class="token-slot" style="background: #eab308;"></div>
            </div>
        </div>
        <div class="base base-blue">
            <div class="base-inner">
                <div class="token-slot" style="background: #3b82f6;"></div>
                <div class="token-slot" style="background: #3b82f6;"></div>
                <div class="token-slot" style="background: #3b82f6;"></div>
                <div class="token-slot" style="background: #3b82f6;"></div>
            </div>
        </div>
        <div class="center-home">HELLA</div>
    </div>

    <!-- Dice & Controls -->
    <div class="controls">
        <div class="status-text" id="status">آپ کی باری ہے!</div>
        <button class="dice-btn" id="diceBtn" onclick="rollDice()">🎲</button>
    </div>

    <script>
        function rollDice() {
            const btn = document.getElementById('diceBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.innerText = "چھکا گھوم رہا ہے...";
            
            let count = 0;
            const interval = setInterval(() => {
                btn.innerText = Math.floor(Math.random() * 6) + 1;
                count++;
                if (count > 8) {
                    clearInterval(interval);
                    const finalDice = Math.floor(Math.random() * 6) + 1;
                    btn.innerText = finalDice;
                    status.innerText = "عدد آ گیا: " + finalDice;
                    btn.disabled = false;
                }
            }, 80);
        }
    </script>
</body>
</html>
